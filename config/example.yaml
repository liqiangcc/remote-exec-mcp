runtime:
  # Global cap across network-backed MCP operations.
  max_concurrency: 4
  transfer_timeout_seconds: 60
  audit_path: .remote-exec-mcp/audit.jsonl

  # File tools are disabled unless these local roots are explicitly configured.
  # The directories must already exist so the runtime can canonicalize them.
  allowed_local_upload_roots:
    - /tmp/remote-exec-mcp-staging
  allowed_local_download_roots:
    - /tmp/remote-exec-mcp-staging

targets:
  local-test:
    transport:
      type: ssh
      host: 127.0.0.1
      port: 22
      user: deploy
      auth:
        type: key
        # The environment variable contains the PEM/OpenSSH private-key contents,
        # not a path to the key file.
        secret_ref: env:REMOTE_EXEC_SSH_KEY
      host_key_policy: strict
      # Optional. Defaults to the current user's ~/.ssh/known_hosts.
      known_hosts_path: /home/user/.ssh/known_hosts
      connect_timeout_seconds: 10
    policy:
      allowed_tasks:
        - whoami
        - service-status
      allowed_upload_roots:
        - /tmp/remote-exec-mcp
      allowed_download_roots:
        - /var/log
      # File transfer remains disabled for a target unless this is configured.
      max_transfer_bytes: 104857600

tasks:
  whoami:
    description: Show the remote account identity
    execution:
      type: command
      program: whoami
      args: []
    timeout_seconds: 5

  service-status:
    description: Show status for a systemd service
    parameters:
      service:
        type: string
        pattern: "^[a-zA-Z0-9_.@-]+$"
        required: true
    execution:
      type: command
      program: systemctl
      args: ["status", "{{service}}", "--no-pager"]
    timeout_seconds: 15
