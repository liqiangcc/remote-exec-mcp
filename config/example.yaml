targets:
  local-test:
    transport:
      type: ssh
      host: 127.0.0.1
      port: 22
      user: deploy
      auth:
        type: key
        secret_ref: env:REMOTE_EXEC_SSH_KEY
      host_key_policy: strict
      # Optional. Defaults to the current user's ~/.ssh/known_hosts.
      known_hosts_path: /home/user/.ssh/known_hosts
      connect_timeout_seconds: 10
    policy:
      allowed_tasks:
        - whoami
        - service-status
      # Remote destination roots for upload_file.
      allowed_upload_roots:
        - /tmp/remote-exec-mcp
      # Remote source roots for download_file.
      allowed_download_roots:
        - /var/log/my-app
      # Local MCP-host source roots for upload_file.
      allowed_local_upload_roots:
        - /home/user/artifacts
      # Local MCP-host destination roots for download_file.
      allowed_local_download_roots:
        - /home/user/downloads
      max_transfer_bytes: 104857600
      transfer_timeout_seconds: 60

tasks:
  whoami:
    description: Show the remote account identity
    execution:
      type: command
      program: whoami
      args: []
    timeout_seconds: 5

  service-status:
    description: Show status for a systemd service
    parameters:
      service:
        type: string
        pattern: "^[a-zA-Z0-9_.@-]+$"
        required: true
    execution:
      type: command
      program: systemctl
      args: ["status", "{{service}}", "--no-pager"]
    timeout_seconds: 15
