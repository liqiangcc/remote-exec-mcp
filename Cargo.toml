[package]
name = "remote-exec-mcp"
version = "0.1.0"
edition = "2021"
description = "A safe, auditable MCP server for controlled remote execution over SSH"
license = "MIT"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
