[package]
name = "remote-exec-mcp"
version = "0.1.0"
edition = "2021"
description = "A safe, auditable MCP server for controlled remote execution over SSH"
license = "MIT"

[dependencies]
anyhow = "1"
regex = "1"
rmcp = { version = "2.2", features = ["server", "transport-io", "schemars"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rand = "0.10"
tempfile = "3"
